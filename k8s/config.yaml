apiVersion: v1
kind: Secret
metadata:
  name: ttt-secrets
type: Opaque
stringData:
  JWT_SECRET: "change_me_to_something_long_and_random"
  INTERNAL_SYNC_SECRET: "change_me_internal_secret"
  # Point this at a real Azure Storage Account connection string for a cloud deployment.
  AZURE_STORAGE_CONNECTION_STRING: "UseDevelopmentStorage=true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ttt-config
data:
  ENTRIES_DB_URL: "postgres://ttt:ttt@postgres:5432/entries_db"
  INTEGRATIONS_DB_URL: "postgres://ttt:ttt@postgres:5432/integrations_db"
  AZURE_STORAGE_CONTAINER: "entry-images"
  FAVICON_LOOKUP_BASE: "https://www.google.com/s2/favicons"
