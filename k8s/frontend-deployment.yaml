apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttt-frontend
spec:
  replicas: 2
  selector:
    matchLabels: { app: ttt-frontend }
  template:
    metadata:
      labels: { app: ttt-frontend }
    spec:
      containers:
        - name: frontend
          image: ttt-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5173 }]
          env:
            - { name: VITE_ENTRIES_API_URL, value: "http://localhost:4000" }
            - { name: VITE_INTEGRATIONS_API_URL, value: "http://localhost:4001" }
---
apiVersion: v1
kind: Service
metadata:
  name: ttt-frontend
spec:
  type: NodePort
  selector: { app: ttt-frontend }
  ports:
    - { port: 5173, targetPort: 5173 }
